- name: Homeboi server
  hosts: homeboi
  vars_files:
    - vars/defaults.yml
    - vars/dns.yml
    - vars/homeboi.yml
    - vars/vault.yml
  roles:
    - role: geerlingguy.security
      become: yes
      tags:
        - security

    - role: geerlingguy.ntp
      become: yes
      tags:
        - ntp

    - role: geerlingguy.node_exporter
      become: yes
      tags:
        - node_exporter
        - monitoring

    - role: roles/docker
      become: yes
      tags:
        - system
        - docker

    - role: roles/system
      become: yes
      tags:
        - system

    - role: roles/fancontrol
      become: yes
      tags:
        - fancontrol

    - role: roles/backup
      become: yes
      tags:
        - backup

    - role: roles/ups
      become: yes
      tags:
        - ups

    - role: roles/containers

    # Must follow roles/containers: the reload handler shells into the running
    # pihole container.
    - role: roles/pihole_records
      vars:
        pihole_dnsmasq_dir: "{{ docker_dir }}/pihole/etc-dnsmasq.d"
        pihole_reload_cmd: docker restart pihole
      tags:
        - containers
        - pihole

    - role: roles/gameservers

    - role: roles/mbtaweb
      tags:
        - mbta

    - role: ddns
      become: yes
      tags:
        - ddns
