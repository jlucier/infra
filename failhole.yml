- name: Failhole (secondary Pi-hole)
  hosts: failhole
  vars_files:
    - vars/defaults.yml
    - vars/dns.yml
    - vars/vault.yml
  roles:
    # A native Pi-hole install, so the role defaults apply unchanged. Keep
    # these records the same as homeboi's. nebula-sync copies Pi-hole's own
    # config over the API, but it never touches /etc/dnsmasq.d.
    - role: roles/pihole_records
      tags:
        - pihole
