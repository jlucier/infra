# Fan control: GPU-temp-driven PWM for the Tesla V100's 12V blower fan. The V100
# has no fan of its own. The blower plugs into PUMP_FAN1 (NCT6687 pwm2/fan2)
# because that header takes the most current. Blower spec: 1400 RPM / 0.1A at
# 30%, 4800 RPM / 1.5A at 100%. The board manual rates the fan headers at 3A in
# PWM mode and 1A in DC mode, so set PUMP_FAN1 to PWM mode in BIOS > HARDWARE
# MONITOR. In PWM mode the header holds 12V at every duty.
#
# The daemon sets pwm2 in manual mode (pwm2_enable=1). When the daemon stops,
# pwm2 keeps its last value and BIOS does not take the header back.
#
# pwm_channel: to confirm the channel, change pwm2 by hand and watch
# /sys/class/hwmon/hwmon*/fan2_input.
#
# gpu_index: 1 = Tesla V100 (board name "PG500-216" in nvidia-smi); 0 = GTX 1650.
#
# Curve breakpoints [gpu_temp_deg_C, pwm_0-255]. The daemon interpolates between
# the points.
gpu_fan_pwm_channel: 2
gpu_fan_gpu_index: 1
gpu_fan_poll_interval: 5
gpu_fan_curve:
  - [30, 0]
  - [55, 80]
  - [65, 120]
  - [72, 145]
  - [78, 180]

# The NVIDIA driver stays on the 580.xx branch. The 595 branch moved Volta to
# legacy and refuses to claim the V100. Only the GTX 1650 stays usable, and the
# boot log shows "NVRM: ignoring the legacy GPU 0000:2b:00.0". 580.173.02 is the
# newest branch that drives both cards, and Volta will not come back.
#
# Someone must install the driver by hand. Ansible does not. The docker role
# manages only nvidia-docker2. The 580 packages are pinned with apt-mark hold, so
# installing a newer branch fails on the held packages instead of silently
# dropping the V100. Taking a 580.x point release needs an explicit unhold,
# upgrade, and re-hold.
#
# GPU1: Tesla V100 (board name "PG500-216" in nvidia-smi). ollama
# (ai-compose.yml) and immich-machine-learning (immich-compose.yml) both use it.
# Both name it by device UUID, not by index, because the enumeration order can
# change. Get the UUID with:
#   nvidia-smi --query-gpu=index,uuid,name --format=csv
gpu_v100_uuid: GPU-8b7684fd-7ddc-5abd-badd-bded4dfe50f0

username: jordan
local_ip: "{{ homeboi_ip }}"
enable_nvidia_docker: true

docker_dir: /fastboi/docker

# godaddy_hostname / dns_name now live in vars/dns.yml, shared with failhole.

# ytdlp
ytdlp_sync_subdir: dev/ytdlp
ytdlp_download_dir: /bigboi/media/youtube
ytdlp_sleep: 3600

# APC UPSes connected to the host over USB. The "server" UPS powers homeboi and
# shuts it down when the battery gets low.
#
# usb_id_product is the lsusb idProduct hex. Vendor 051d is APC. Get it with:
#   lsusb -d 051d:
# If two UPSes share one idProduct, also set usb_serial to tell them apart. Get
# the serial with:
#   lsusb -v -d 051d:<id> | grep iSerial
upses:
  - name: server
    upsname: BR1500S
    usb_serial: 0B2552L13098
    nis_port: 3551
    exporter_port: 9162
    triggers_shutdown: true
    battery_level: 15  # shutdown when battery % drops below this
    minutes: 5         # shutdown when estimated runtime (min) drops below this
    timeout: 0         # 0 = never shutdown solely on time-on-battery
  # The "network" UPS is no longer connected.
  # - name: network
  #   upsname: BE600M1
  #   usb_serial: 4B2301P07253
  #   nis_port: 3552
  #   exporter_port: 9163
  #   triggers_shutdown: false
