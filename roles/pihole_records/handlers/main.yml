---
- name: reload pihole dns
  # Pi-hole v6 has no `restartdns`. `reloaddns` refreshes the lists and flushes
  # the cache, but it does NOT re-read /etc/dnsmasq.d. A record change needs a
  # full FTL restart.
  become: true
  ansible.builtin.command:
    cmd: "{{ pihole_reload_cmd }}"
  changed_when: true
