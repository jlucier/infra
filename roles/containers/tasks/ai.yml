---
- name: Configure AI Stack
  tags:
    - containers
    - ai
    - odysseus
    - litellm
    - llm
  block:
    - name: Create and chmod ai folders
      become: true
      file:
        path: "{{ item }}"
        owner: "{{ username }}"
        group: "{{ username }}"
        state: directory
        mode: 0755
        recurse: true
      loop:
        - "{{ docker_dir }}/ai/ollama_cache"
        - "{{ docker_dir }}/ai/data"
        - "{{ docker_dir }}/ai/logs"
        - "{{ docker_dir }}/ai/chromadb"
        - "{{ docker_dir }}/ai/searxng"
        - "{{ docker_dir }}/ai/ntfy"
        - "{{ docker_dir }}/ai/litellm"

    # This directory is not in the loop above, because that loop recurses. It
    # would reset the owner and the mode of every file Postgres keeps in its
    # own data dir. Only the top directory must exist with the right owner
    # before the first init. The owner and group here must match the `user:`
    # pinned on the litellm-db service in ai-compose.yml.
    - name: Create litellm-db data dir
      become: true
      file:
        path: "{{ docker_dir }}/ai/litellm-db"
        owner: "70"
        group: "70"
        state: directory
        mode: 0700

    - name: Clone/update odysseus source
      become: true
      become_user: "{{ username }}"
      git:
        repo: https://github.com/pewdiepie-archdaemon/odysseus.git
        dest: "{{ docker_dir }}/ai/src"
        version: main
      register: odysseus_src

    - name: Sync litellm config
      become: true
      template:
        src: files/litellm-config.yaml
        dest: "{{ docker_dir }}/ai/litellm/config.yaml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: 0600

    - name: Sync compose file
      become: true
      template:
        src: files/ai-compose.yml
        dest: "{{ docker_dir }}/ai/docker-compose.yml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: 0600

    - name: Run ai compose file
      community.docker.docker_compose_v2:
        project_src: "{{ docker_dir }}/ai"
        build: always
