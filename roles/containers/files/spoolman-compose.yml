# Managed by Ansible (roles/containers/tasks/spoolman.yml). Do not edit on the host.
services:
  spoolman:
    container_name: spoolman
    image: ghcr.io/donkie/spoolman:latest
    restart: unless-stopped
    environment:
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/spoolman/data:/home/app/.local/share/spoolman"
    networks:
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spoolman.rule=Host(`spoolman.{{ dns_name }}`)"
      - "traefik.http.routers.spoolman.entrypoints=https"
      - "traefik.http.routers.spoolman.tls.certresolver=godaddy"
      - "traefik.http.services.spoolman.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true
