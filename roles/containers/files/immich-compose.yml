# Managed by Ansible (roles/containers/tasks/immich.yml). Do not edit on the
# host.
#
# The standard Immich stack: server, ML, redis, and postgres. Immich owns and
# reorganizes everything under UPLOAD_LOCATION, so UPLOAD_LOCATION points at
# /bigboi/media/immich-library on the bulk storage pool. It does not point at
# fastboi/docker, which is small fast storage for app configs. It also does not
# point at the /bigboi/media/photos and /bigboi/media/videos trees, which keep
# their own layout. The model cache and the Postgres data dir stay under
# docker_dir, because they are small and the faster disk helps them.
#
# To bring the /bigboi/media/photos and /bigboi/media/videos libraries in, run
# immich-go (https://github.com/simulot/immich-go) by hand against those source
# trees with this server's API key. It uploads into the managed library above,
# keeps the EXIF dates, and turns each folder into an album. That is a one-time
# job, not a service, so this compose file does not run it.
#
# immich-machine-learning shares GPU1 with ollama for CLIP inference and face
# recognition. GPU1 is the Tesla V100, board name "PG500-216" in nvidia-smi,
# and ai-compose.yml pins ollama to the same device UUID. immich-server runs on
# the CPU. To get NVENC transcoding later, add the same device reservation to
# immich-server.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:{{ immich_version }}
    container_name: immich-server
    volumes:
      - "/bigboi/media/immich-library:/usr/src/app/upload"
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - DB_HOSTNAME=immich-db
      - DB_USERNAME=immich
      - DB_PASSWORD={{ immich_db_password }}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    restart: unless-stopped
    depends_on:
      immich-redis:
        condition: service_started
      immich-db:
        condition: service_healthy
    networks:
      immich:
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.{{ dns_name }}`)"
      - "traefik.http.routers.immich.entrypoints=https"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich.tls.certresolver=godaddy"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}-cuda
    container_name: immich-machine-learning
    volumes:
      - "{{ docker_dir }}/immich/model-cache:/cache"
    environment:
      - DB_HOSTNAME=immich-db
      - DB_USERNAME=immich
      - DB_PASSWORD={{ immich_db_password }}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    restart: unless-stopped
    networks:
      immich:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['{{ gpu_v100_uuid }}']
              capabilities: [gpu]
    runtime: nvidia

  immich-redis:
    image: docker.io/redis:6.2-alpine
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      immich:

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    container_name: immich-db
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD={{ immich_db_password }}
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - "{{ docker_dir }}/immich/db:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      immich:

networks:
  immich:
  proxy:
    external: true
