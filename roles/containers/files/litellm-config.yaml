# Managed by Ansible (roles/containers/tasks/ai.yml). Do not edit on the host.
#
# LiteLLM proxy config. ai-compose.yml puts the master key and the database URL
# in the environment. This file reads them back as os.environ/..., so no secret
# is stored here.
model_list:
  # A wildcard route. Every model in the local ollama keeps its own name, so a
  # request for "qwen2.5-coder" goes to ollama_chat/qwen2.5-coder, which is the
  # /api/chat endpoint. A new model needs no change here. Run
  # `ollama pull <name>` only.
  - model_name: "*"
    litellm_params:
      model: "ollama_chat/*"
      api_base: "http://ollama:11434"
  # If a tool needs the /v1/completions (FIM) path instead of the chat path,
  # add that model here with the "ollama/" prefix. For example:
  # - model_name: "qwen2.5-coder-fim"
  #   litellm_params:
  #     model: "ollama/qwen2.5-coder"
  #     api_base: "http://ollama:11434"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
