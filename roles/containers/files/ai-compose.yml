# Managed by Ansible (roles/containers/tasks/ai.yml). Do not edit on the host.
#
# Self-hosted AI stack. The local `ollama` container runs the inference on the
# GPU. Only the internal network reaches it, at http://ollama:11434. Traefik
# does NOT expose it. Two frontends call it, and Traefik exposes both. Each
# frontend has its own auth.
#   - odysseus: an AI workspace
#       (https://github.com/pewdiepie-archdaemon/odysseus). Its own built-in
#       account auth guards it. It runs on the CPU and calls ollama.
#   - litellm: an OpenAI-compatible gateway at https://litellm.<dns>. Its master
#       key and its virtual keys control access. The litellm-db Postgres stores
#       the virtual keys, so each person can get a separate key for a tool such
#       as opencode, and you can revoke one key alone.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      ai:
    volumes:
      - "{{ docker_dir }}/ai/ollama_cache:/root/.ollama"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['{{ gpu_v100_uuid }}']
              capabilities: [gpu]
    runtime: nvidia

  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    container_name: litellm
    restart: unless-stopped
    networks:
      ai:
      proxy:
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - "./litellm/config.yaml:/app/config.yaml:ro"
    environment:
      # Admin key. It must start with sk-. It logs in to the UI at /ui and
      # creates or revokes virtual keys through the API. The virtual keys and
      # the spend records need the database below.
      - LITELLM_MASTER_KEY={{ litellm_master_key }}
      - DATABASE_URL=postgresql://litellm:{{ litellm_db_password }}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True
    depends_on:
      litellm-db:
        condition: service_healthy
      ollama:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`litellm.{{ dns_name }}`)"
      - "traefik.http.routers.litellm.entrypoints=https"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
      - "traefik.http.routers.litellm.tls.certresolver=godaddy"

  litellm-db:
    image: docker.io/postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    # Pinned to the uid/gid that the image's `postgres` account uses today, so
    # the data directory keeps one fixed owner. An image update that renumbers
    # that account then cannot lock Postgres out of its own files.
    user: "70:70"
    networks:
      ai:
    volumes:
      - "./litellm-db:/var/lib/postgresql/data:z"
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD={{ litellm_db_password }}
      - POSTGRES_DB=litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  odysseus:
    # Built from the git checkout in ./src (no published image upstream).
    build: ./src
    container_name: odysseus
    restart: unless-stopped
    networks:
      ai:
      proxy:
    volumes:
      - "./data:/app/data:z"
      - "./logs:/app/logs:z"
      - "./data/ssh:/app/.ssh:z"
      - "./data/huggingface:/app/.cache/huggingface:z"
      - "./data/local:/app/.local:z"
    environment:
      # Inference (local ollama)
      - LLM_HOST=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      # Bundled services (in-network)
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      # Embeddings. fastembed runs them on the CPU and downloads about 50MB on
      # the first run. To move them onto ollama, pull an embed model there, then
      # set EMBEDDING_URL=http://ollama:11434/v1/embeddings and EMBEDDING_MODEL.
      - FASTEMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      # Auth, and the settings that suit HTTPS behind Traefik
      - AUTH_ENABLED=true
      - LOCALHOST_BYPASS=false
      - SECURE_COOKIES=true
      - ALLOWED_ORIGINS=https://odysseus.{{ dns_name }}
      - ODYSSEUS_ADMIN_USER=admin
      # Optional admin password from the vault. If it is empty, Odysseus
      # generates a temporary password and prints it to the container logs on
      # the first boot.
      - ODYSSEUS_ADMIN_PASSWORD={{ odysseus_admin_password | default('') }}
      - DATABASE_URL=sqlite:///./data/app.db
      - PUID={{ uid }}
      - PGID={{ guid }}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odysseus.rule=Host(`odysseus.{{ dns_name }}`)"
      - "traefik.http.routers.odysseus.entrypoints=https"
      - "traefik.http.services.odysseus.loadbalancer.server.port=7000"
      - "traefik.http.routers.odysseus.tls.certresolver=godaddy"

  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: odysseus-chromadb
    restart: unless-stopped
    networks:
      ai:
    volumes:
      - "./chromadb:/chroma/chroma:z"
    environment:
      - ANONYMIZED_TELEMETRY=FALSE

  searxng:
    # A pinned tag, not :latest. odysseus waits on the searxng healthcheck, so
    # a broken upstream tag stops the whole app from starting. Before you change
    # this tag, confirm that the newer one starts without an error. See the
    # upstream compose comments.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    container_name: odysseus-searxng
    restart: unless-stopped
    networks:
      ai:
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - "./searxng:/etc/searxng:z"
      - "./src/config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s

  ntfy:
    image: docker.io/binwiederhier/ntfy
    container_name: odysseus-ntfy
    restart: unless-stopped
    command: serve
    networks:
      ai:
    volumes:
      - "./ntfy:/var/cache/ntfy:z"
    environment:
      - NTFY_BASE_URL=http://ntfy

networks:
  ai:
  proxy:
    external: true
