# Navidrome server config. ND_CONFIGFILE in media-compose.yml loads it. The
# image does not read this file on its own. An environment variable overrides
# any value here.
#
# This file sets only the values that differ from the upstream defaults, so the
# rest follow upstream. Read the full list of options at
# https://www.navidrome.org/docs/usage/configuration/options/

MusicFolder = '/music'
DataFolder = '/data'

# Scanning

# The file watcher catches the daily changes. This scan catches what the
# watcher misses. The default is no periodic scan.
Scanner.Schedule = '@every 24h'

# Navidrome splits a role tag (PERFORMER, COMPOSER, and so on) on a bare '/'.
# Without this exception it reads AC/DC as two artists.
Scanner.ArtistSplitExceptions = 'AC/DC'

# Sort by SORT_* tags where present. Default false.
PreferSortTags = true

# External metadata

# The default order. Deezer and ListenBrainz need no setup. Last.fm is the only
# built-in agent that supplies album covers, and it needs a key from
# https://www.last.fm/api/account/create. The vault holds it as
# navidrome_lastfm_*.
Agents = 'deezer,lastfm,listenbrainz'
LastFM.ApiKey = '{{ navidrome_lastfm_api_key | default('') }}'
LastFM.Secret = '{{ navidrome_lastfm_secret | default('') }}'

# Artwork

# CoverArtPriority and ArtistArtPriority keep their defaults, which match the
# Picard layout. Navidrome reads cover.jpg beside the tracks first, then
# artist.jpg in the artist folder, then the embedded art, then the agents.
CoverArtQuality = 80      # default 75
UICoverArtSize = 600      # default 300
ImageCacheSize = '500MB'  # default 100MB

# Database backups

# This path is inside DataFolder, so the borg job for fastboi/docker backs it
# up. All three values are disabled by default.
Backup.Path = '/data/backup'
Backup.Schedule = '0 3 * * *'
Backup.Count = 7
