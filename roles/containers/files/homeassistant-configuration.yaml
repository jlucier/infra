# Seeded by Ansible (roles/containers/tasks/homeassistant.yml) on the first run
# only. After that the file belongs to you and to the Home Assistant UI, and
# Ansible leaves it alone. Ansible cannot own it, because the UI writes to it.

# Loads the standard set of integrations, including the discovery that the host
# network exists for.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
