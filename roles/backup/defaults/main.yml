---
# Nightly borg backups, driven by borgmatic. One config file per dataset, in
# borgmatic_config_dir. borgbase alerts when too many days pass without a
# backup.

borgmatic_version: "2.1.7"
borgmatic_venv: /opt/borgmatic
borgmatic_bin: /usr/local/bin/borgmatic
borgmatic_config_dir: /etc/borgmatic.d

borgmatic_timer_enabled: true
borgmatic_schedule: "*-*-* 00:00:00"

# A root-owned key that only borgmatic uses.
borgmatic_ssh_key: /root/.ssh/borgmatic_ed25519

# IdentitiesOnly stops ssh from offering any other key, so an auth failure here
# is a real failure and not a fallback to a key in the agent.
borgmatic_ssh_command: "ssh -i {{ borgmatic_ssh_key }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

# The passphrase for every repo. 32 bytes, no trailing newline. The password
# manager holds the copy to restore from.
#
# The repos use repokey, so each repo holds its own key. To refresh the exported
# copies in ~/.borg_keys, export by hand:
#   BORG_RSH="ssh -i ~/.ssh/id_rsa" BORG_PASSPHRASE=$(cat ~/.borg_pass) \
#       borg key export <repo> <dest>
borgmatic_passphrase_file: "/home/{{ username }}/.borg_pass"
borgmatic_log_file: "/home/{{ username }}/backups/borgmatic.log"

# borgmatic derives match_archives from archive_name_format, so prune and check
# read only the archives with this prefix. The older auto-* archives in these
# repos stay untouched.
borgmatic_archive_prefix: borgmatic

borgmatic_keep_daily: 7
borgmatic_keep_weekly: 4
borgmatic_keep_monthly: 6

# borgbase is the repo most likely to be unreachable for a short time.
borgmatic_retries: 3
borgmatic_retry_wait: 60

# One config file per dataset, because each dataset has its own pair of repos.
# A single config would write every source directory to every repository.
borgmatic_datasets:
  - name: storage
    source: /bigboi/storage
    repositories:
      - label: borgbase
        path: "{{ storage_borgbase_repo }}"
      - label: lilboi
        path: "{{ storage_lilboi_repo }}"

  - name: docker
    source: "{{ docker_dir }}"
    exclude:
      - "{{ docker_dir }}/wireguard"
      # Excluded here, but the sqlite_databases hook below captures it.
      # grafana.db is SQLite with a live journal, so a file copy may not reopen.
      - "{{ docker_dir }}/analytics/grafana"
      # Same reason as grafana.db. home-assistant_v2.db is the recorder
      # history, and Home Assistant writes to it constantly. The
      # sqlite_databases hook below captures it. The -wal and -shm files are
      # only useful next to a matching database file, so drop them too.
      - "{{ docker_dir }}/homeassistant/config/home-assistant_v2.db*"
    repositories:
      - label: borgbase
        path: "{{ homeboi_docker_borgbase_repo }}"
      - label: lilboi
        path: "{{ homeboi_docker_lilboi_repo }}"
    postgresql_databases:
      # The data directory is 0700 and uid 70 owns it, so a file copy cannot
      # read it. This hook dumps the database instead.
      - name: litellm
        username: litellm
        container: litellm-db
    sqlite_databases:
      - name: grafana
        path: "{{ docker_dir }}/analytics/grafana/grafana.db"
      - name: homeassistant
        path: "{{ docker_dir }}/homeassistant/config/home-assistant_v2.db"

  - name: media
    source: /bigboi/media
    exclude:
      - /bigboi/media/djank_music
      - /bigboi/media/downloads
      - /bigboi/media/movies
      - /bigboi/media/music
      - /bigboi/media/tv
      - /bigboi/media/youtube
      - /bigboi/media/.stfolder
      - /bigboi/media/.stignore
    repositories:
      - label: borgbase
        path: "{{ media_borgbase_repo }}"
      - label: lilboi
        path: "{{ media_lilboi_repo }}"
