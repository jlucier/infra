---
# borgmatic. Replaced the hand-rolled files/backup.py on 2026-08-30.
# See ~/notes/personal/projects/borgmatic-port.md.
#
# Replaced backup.py outright rather than running in parallel: borgbase already
# alerts if too many days pass without a backup, which is the safety net the
# parallel run would have provided.

borgmatic_version: "2.1.7"
borgmatic_venv: /opt/borgmatic
borgmatic_bin: /usr/local/bin/borgmatic
borgmatic_config_dir: /etc/borgmatic.d

borgmatic_timer_enabled: true
# Midnight, matching the @daily cron this replaced.
borgmatic_schedule: "*-*-* 00:00:00"

# backup.py ran as jordan and so picked up jordan's SSH key implicitly.
# borgmatic runs as root, which has no private key of its own, so both borgbase
# and lilboi have to be pointed at jordan's key explicitly.
# Dedicated, root-owned key used only by borgmatic. borgmatic runs as root, and
# a root service should not depend on a file in a user's home: if jordan's key
# rotates or /home moves, backups would break silently at midnight. A separate
# key also keeps the backup credential distinct from the interactive one, and is
# restricted to "borg serve" on lilboi (see authorized_keys there).
borgmatic_ssh_key: /root/.ssh/borgmatic_ed25519

# IdentitiesOnly stops ssh offering anything but this key, so a failure here is
# an honest failure rather than a silent fallback to whatever else is around.
borgmatic_ssh_command: "ssh -i {{ borgmatic_ssh_key }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

# The passphrase backup.py generated. Reusing it is what lets borgmatic open the
# existing repos instead of needing new ones. 32 bytes, no trailing newline.
#
# NOTE: not inside any backed-up dataset -- it lives on homeboi's root disk only.
# The passphrase is kept in a password manager; that is the copy that matters.
#
# There is deliberately no keyfile-export hook. With repokey the key already
# lives in the repo, the exported blob never changes, and re-exporting it nightly
# only adds a step that can fail the whole run. Export once by hand if the
# existing copies in ~/.borg_keys ever need refreshing:
#   BORG_RSH="ssh -i ~/.ssh/id_rsa" BORG_PASSPHRASE=$(cat ~/.borg_pass) \
#       borg key export <repo> <dest>
borgmatic_passphrase_file: "/home/{{ username }}/.borg_pass"
borgmatic_log_file: "/home/{{ username }}/backups/borgmatic.log"

# Deliberately not "auto-", which is backup.py's prefix. borgmatic derives
# match_archives from archive_name_format, so prune and check only ever consider
# borgmatic's own archives. Verified on the box: an auto-2020-01-01 archive
# survived a borgmatic prune with keep_monthly=6.
borgmatic_archive_prefix: borgmatic

# Unchanged from config.toml.
borgmatic_keep_daily: 7
borgmatic_keep_weekly: 4
borgmatic_keep_monthly: 6

# backup.py had no retry at all. borgbase is the repo most likely to be briefly
# unreachable.
borgmatic_retries: 3
borgmatic_retry_wait: 60

# One config file per dataset, because each dataset has its own pair of repos.
# A single config would write every source directory to every repository.
borgmatic_datasets:
  - name: storage
    source: /bigboi/storage
    repositories:
      - label: borgbase
        path: "{{ storage_borgbase_repo }}"
      - label: lilboi
        path: "{{ storage_lilboi_repo }}"

  - name: docker
    source: "{{ docker_dir }}"
    exclude:
      - "{{ docker_dir }}/wireguard"
      # Excluded as a directory but captured properly below: grafana.db is
      # SQLite with a live journal, so a snapshot of it may not reopen.
      - "{{ docker_dir }}/analytics/grafana"
    repositories:
      - label: borgbase
        path: "{{ homeboi_docker_borgbase_repo }}"
      - label: lilboi
        path: "{{ homeboi_docker_lilboi_repo }}"
    postgresql_databases:
      # The database backup.py silently skipped for 549 log lines: the data
      # directory is 0700 owned by uid 70.
      - name: litellm
        username: litellm
        container: litellm-db
    sqlite_databases:
      - name: grafana
        path: "{{ docker_dir }}/analytics/grafana/grafana.db"

  - name: media
    source: /bigboi/media
    exclude:
      - /bigboi/media/djank_music
      - /bigboi/media/downloads
      - /bigboi/media/movies
      - /bigboi/media/music
      - /bigboi/media/tv
      - /bigboi/media/youtube
      - /bigboi/media/.stfolder
      - /bigboi/media/.stignore
    repositories:
      - label: borgbase
        path: "{{ media_borgbase_repo }}"
      - label: lilboi
        path: "{{ media_lilboi_repo }}"
