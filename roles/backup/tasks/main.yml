---
# Backups are borgmatic (tasks/borgmatic.yml). borg itself is still installed
# here because borgmatic drives it -- see local_path in the config template.

- name: Install borg
  tags:
    - backups
  get_url:
    url: https://github.com/borgbackup/borg/releases/download/1.4.2/borg-linux-glibc231-x86_64
    dest: /usr/local/bin/borg
    mode: 775
    owner: root
    group: root

- name: Install python3.11
  tags:
    - backups
  apt:
    name: python3.11
    state: present

- name: Backups
  import_tasks: borgmatic.yml
