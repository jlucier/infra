---
# borgmatic runs as root. The data directories under {{ docker_dir }} are 0700 and
# container uids own them, so no other user can read them.
#
# The ZFS hook needs borgmatic 1.9.3. Ubuntu 22.04 ships 1.5.20, and backports
# ships 1.7.9, so this role installs a pinned venv instead of the apt package.

- name: Install borgmatic
  tags:
    - backups
    - borgmatic
  block:
    - name: Venv and sqlite dependencies
      apt:
        name:
          - python3.11-venv
          # The sqlite database hook calls sqlite3, which the host does not
          # install by default.
          - sqlite3
        state: present

    - name: Borgmatic venv
      pip:
        name: "borgmatic=={{ borgmatic_version }}"
        virtualenv: "{{ borgmatic_venv }}"
        virtualenv_command: /usr/bin/python3.11 -m venv

    - name: Link borgmatic onto PATH
      file:
        src: "{{ borgmatic_venv }}/bin/borgmatic"
        dest: "{{ borgmatic_bin }}"
        state: link

- name: Borgmatic SSH key
  tags:
    - backups
    - borgmatic
  # Register the public half by hand on borgbase. On lilboi, a forced command in
  # authorized_keys restricts it to "borg serve".
  openssh_keypair:
    path: "{{ borgmatic_ssh_key }}"
    type: ed25519
    comment: "borgmatic@{{ inventory_hostname }}"
    owner: root
    group: root
    mode: "0600"
    regenerate: never

- name: Configure borgmatic
  tags:
    - backups
    - borgmatic
  block:
    # 0700 and 0600 throughout. These files hold the repo URLs, which are vault
    # values. The borgbase URLs are user@host:repo strings.
    - name: Config directory
      file:
        path: "{{ borgmatic_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Per-dataset config
      template:
        src: borgmatic.yaml.j2
        dest: "{{ borgmatic_config_dir }}/{{ item.name }}.yaml"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ borgmatic_datasets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Rotate the borgmatic log
      template:
        src: borgmatic-logrotate.j2
        dest: /etc/logrotate.d/borgmatic
        owner: root
        group: root
        mode: "0644"

    - name: Validate generated config
      command: "{{ borgmatic_bin }} -c {{ borgmatic_config_dir }}/{{ item.name }}.yaml config validate"
      loop: "{{ borgmatic_datasets }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

- name: Schedule borgmatic
  tags:
    - backups
    - borgmatic
  block:
    - name: Service unit
      template:
        src: borgmatic.service.j2
        dest: /etc/systemd/system/borgmatic.service
        owner: root
        group: root
        mode: "0644"

    - name: Timer unit
      template:
        src: borgmatic.timer.j2
        dest: /etc/systemd/system/borgmatic.timer
        owner: root
        group: root
        mode: "0644"

    # The timer stays off until borgmatic_timer_enabled is true, so this role
    # does not start a second backup system by itself.
    - name: Timer state
      systemd:
        name: borgmatic.timer
        daemon_reload: true
        enabled: "{{ borgmatic_timer_enabled }}"
        state: "{{ 'started' if borgmatic_timer_enabled else 'stopped' }}"
